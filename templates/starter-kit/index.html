<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Star Catcher (Brainstorming Games starter kit)</title>
    <style>
      :root { --bg: #0b0c0e; --fg: #f3f3f4; --mut: #a0a3ab; --acc: #00c0f0; --card: #15171b; }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body { background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, 'Segoe UI', sans-serif; overflow: hidden; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
      /* The game draws on one canvas: that is what the platform's Clip button records. */
      canvas { display: block; width: 100vw; height: 100vh; }
      #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 12px 16px; font-weight: 800; font-variant-numeric: tabular-nums; pointer-events: none; }
      #hud span { color: var(--mut); font-weight: 700; }
      #panel { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(11, 12, 14, 0.72); }
      #panel[hidden] { display: none; }
      .card { width: min(90vw, 380px); background: var(--card); border: 1px solid #2a2c33; border-radius: 18px; padding: 24px; text-align: center; display: flex; flex-direction: column; gap: 12px; }
      .card h1 { font-size: 1.6rem; letter-spacing: -0.02em; }
      .card p { color: var(--mut); }
      button { font: inherit; font-weight: 800; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; }
      .primary { background: var(--acc); color: #0b0c0e; }
      .secondary { background: #23262d; color: var(--fg); }
      button[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div><span>Score</span> <b id="score">0</b></div>
      <div><span>Best</span> <b id="best">0</b></div>
      <div><span>Time</span> <b id="time">45</b></div>
    </div>
    <div id="panel" hidden>
      <div class="card">
        <h1 id="panel-title">Time's up!</h1>
        <p id="panel-text"></p>
        <button id="more-time" class="secondary">Watch an ad for +10 seconds</button>
        <button id="again" class="primary">Play again</button>
      </div>
    </div>
    <!--
      The Brainstorming SDK. Keep this file next to index.html: when you upload your zip, the
      platform replaces it with the latest version automatically.
    -->
    <script src="bg-sdk.js"></script>
    <script src="game.js"></script>
  </body>
</html>
