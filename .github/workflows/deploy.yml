name: Deploy

# Builds the static site and deploys it to Cloudflare Pages (free plan allows commercial use).
# Runs on every push to main and when the deploy-hook Edge Function asks for a rebuild after a
# game is published (debounced to at most one build per 30 minutes).
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [rebuild]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_PLAY_ORIGIN: ${{ vars.NEXT_PUBLIC_PLAY_ORIGIN }}
      # Each game on its own origin, e.g. https://{game}.bgplay.net (workers/play).
      NEXT_PUBLIC_GAME_ORIGIN_PATTERN: ${{ vars.NEXT_PUBLIC_GAME_ORIGIN_PATTERN }}
      # Free launch: "1" while all games share the Worker's workers.dev address.
      BG_SHARED_GAME_ORIGIN: ${{ vars.BG_SHARED_GAME_ORIGIN }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_DEVELOPERS_URL: ${{ vars.NEXT_PUBLIC_DEVELOPERS_URL }}
      NEXT_PUBLIC_MANAGE_URL: ${{ vars.NEXT_PUBLIC_MANAGE_URL }}
      NEXT_PUBLIC_AUTH_COOKIE_DOMAIN: ${{ vars.NEXT_PUBLIC_AUTH_COOKIE_DOMAIN }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
      NEXT_PUBLIC_ADSENSE_SLOT_GAME_SIDE: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_GAME_SIDE }}
      NEXT_PUBLIC_ADSENSE_SLOT_RESPONSIVE: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_RESPONSIVE }}
      NEXT_PUBLIC_INGAME_ADS: ${{ vars.NEXT_PUBLIC_INGAME_ADS }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
      NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.NEXT_PUBLIC_CF_ANALYTICS_TOKEN }}
      # Read-only use at build time: the catalogue snapshot only selects public games.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The three sites are three Cloudflare Pages projects (free *.pages.dev addresses, or your
      # own domains later). The project names come from GitHub variables.
      - name: Deploy the player site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy apps/web/out --project-name="${{ vars.CF_PAGES_PROJECT }}" --branch=main
      - name: Deploy the developer portal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy apps/web/out-developers --project-name="${{ vars.CF_PAGES_PROJECT_DEVELOPERS }}" --branch=main
      - name: Deploy the management portal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy apps/web/out-manage --project-name="${{ vars.CF_PAGES_PROJECT_MANAGE }}" --branch=main
