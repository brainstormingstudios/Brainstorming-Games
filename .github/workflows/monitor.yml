name: Live security check

# Every 3 hours: the sites, the games server and the database answer, the security headers are in
# place, private tables and game builds stay private, and the management portal stays hidden.
# A failed run makes GitHub e-mail the repository owner. (Every 3 hours keeps well inside the
# 2,000 free Actions minutes a month.)
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/monitor-live.mjs
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          DEVELOPERS_URL: ${{ vars.NEXT_PUBLIC_DEVELOPERS_URL }}
          MANAGE_URL: ${{ vars.NEXT_PUBLIC_MANAGE_URL }}
          PLAY_ORIGIN: ${{ vars.NEXT_PUBLIC_PLAY_ORIGIN }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
