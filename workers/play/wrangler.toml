# Game files Worker. Deploy with:
#   npx wrangler deploy --config workers/play/wrangler.toml
#
# FREE LAUNCH (now): the Worker runs on its free address https://bg-play.<your-subdomain>.workers.dev
# and all games share it. Set SHARED_HOST to that host after the first deploy (docs/GO-LIVE-FREE.md).
#
# LATER, with a games domain (every game sealed off on its own address): set workers_dev = false,
# uncomment `routes`, fill GAMES_DOMAIN and empty SHARED_HOST (docs/DEPLOY.md, "Game origins").
name = "bg-play"
main = "index.mjs"
compatibility_date = "2025-06-01"
workers_dev = true
# routes = [{ pattern = "*.bgplay.example/*", zone_name = "bgplay.example" }]

# Game files: the private "builds" bucket in Supabase Storage (free, no card). Before the first
# deploy, store the Worker's own Supabase secret key (Supabase > Project Settings > API Keys >
# new secret key "games-server"); you paste it, it is never written into a file:
#   npx wrangler secret put SUPABASE_STORAGE_KEY --config workers/play/wrangler.toml
# To use Cloudflare R2 instead, uncomment this block; the Worker then reads R2 and ignores Supabase.
# [[r2_buckets]]
# binding = "BUILDS"
# bucket_name = "bg-play"

[vars]
SUPABASE_URL = "https://zoqjrxgwtfxaqnhlraoz.supabase.co"
STORAGE_BUCKET = "builds"
SHARED_HOST = "bg-play.brainstorming-games.workers.dev"
GAMES_DOMAIN = ""
# The sites allowed to frame games, separated by spaces.
SITE_ORIGINS = "https://brainstorming-games.pages.dev https://brainstorming-games-dev.pages.dev https://bgm-areuctw3.pages.dev"
