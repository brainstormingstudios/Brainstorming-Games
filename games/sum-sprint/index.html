<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sum Sprint</title>
    <style>
      :root { --bg: #0d0e10; --card: #1c1e23; --edge: #2c2f37; --fg: #f3f3f4; --mut: #a0a3ab; --acc: #ffd43b; }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, 'Segoe UI', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
      main { width: min(92vw, 460px); display: flex; flex-direction: column; gap: 16px; }
      header { display: flex; justify-content: space-between; align-items: baseline; color: var(--mut); font-weight: 800; font-variant-numeric: tabular-nums; }
      header b { color: var(--fg); }
      #bar { height: 8px; border-radius: 8px; background: var(--card); overflow: hidden; }
      #bar i { display: block; height: 100%; width: 100%; background: var(--acc); transform-origin: 0 50%; }
      #question { text-align: center; font-size: clamp(2.6rem, 13vw, 4.2rem); font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; padding: 18px 0; }
      #question.right { animation: nod 0.25s ease-out; }
      #question.wrong { animation: shake 0.3s ease-out; color: #ff5c5c; }
      #answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      #answers button { height: 72px; border-radius: 14px; border: 1px solid var(--edge); background: var(--card); color: var(--fg); font: 800 1.6rem inherit; font-variant-numeric: tabular-nums; cursor: pointer; transition: transform 0.1s, background 0.1s; }
      #answers button:hover { background: #25272d; }
      #answers button:active { transform: scale(0.97); }
      #answers button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
      #answers kbd { display: block; font: 700 0.7rem inherit; color: var(--mut); }
      @keyframes nod { 50% { transform: translateY(-6px); } }
      @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
      #panel { position: fixed; inset: 0; display: grid; place-items: center; background: rgb(13 14 16 / 0.9); padding: 24px; text-align: center; }
      #panel[hidden] { display: none; }
      #panel div { max-width: 340px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
      #panel p { color: var(--mut); line-height: 1.5; }
      button.go { border: 0; border-radius: 10px; background: var(--acc); color: #141207; font: 800 1.05rem inherit; padding: 13px 26px; cursor: pointer; }
      @media (prefers-reduced-motion: reduce) { #question { animation: none !important; } }
    </style>
  </head>
  <body>
    <main>
      <header><span>Score <b id="score">0</b></span><span>Streak <b id="streak">0</b></span><span>Best <b id="best">0</b></span></header>
      <div id="bar"><i id="fill"></i></div>
      <p id="question" aria-live="polite">7 + 5</p>
      <div id="answers"></div>
    </main>
    <div id="panel">
      <div>
        <h1 id="panel-title">Sum Sprint</h1>
        <p id="panel-text">60 seconds. Pick the right answer as fast as you can. A streak is worth more; a wrong answer costs two seconds.</p>
        <button class="go" id="start" type="button">Start</button>
      </div>
    </div>
    <script src="bg-sdk.js"></script>
    <script src="game.js"></script>
  </body>
</html>
