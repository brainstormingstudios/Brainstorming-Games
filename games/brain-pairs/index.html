<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Brain Pairs</title>
    <style>
      :root { --bg: #0d0e10; --card: #1c1e23; --edge: #2c2f37; --fg: #f3f3f4; --mut: #a0a3ab; --acc: #ffd43b; }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, 'Segoe UI', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
      main { width: min(94vw, 78vh, 560px); display: flex; flex-direction: column; gap: 14px; }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      h1 { font-size: clamp(1.2rem, 4vw, 1.7rem); letter-spacing: -0.03em; }
      .stats { display: flex; gap: 16px; color: var(--mut); font-weight: 700; font-variant-numeric: tabular-nums; }
      .stats b { color: var(--fg); }
      #board { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(6px, 1.6vw, 12px); }
      .tile { position: relative; aspect-ratio: 1; border: 0; background: none; padding: 0; perspective: 600px; cursor: pointer; }
      .face { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 14px; border: 1px solid var(--edge); backface-visibility: hidden; transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
      .back { background: var(--card); }
      .back::after { content: ''; width: 26%; aspect-ratio: 1; border-radius: 50%; background: var(--edge); }
      .front { transform: rotateY(180deg); background: #23262d; }
      .front svg { width: 56%; height: 56%; }
      .tile.open .back { transform: rotateY(180deg); }
      .tile.open .front { transform: rotateY(360deg); }
      .tile.done .front { border-color: var(--acc); animation: pop 0.4s ease-out; }
      .tile:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; border-radius: 14px; }
      @keyframes pop { 40% { transform: rotateY(360deg) scale(1.08); } }
      #panel { position: fixed; inset: 0; display: grid; place-items: center; background: rgb(13 14 16 / 0.88); padding: 24px; text-align: center; }
      #panel[hidden] { display: none; }
      #panel div { max-width: 340px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
      #panel p { color: var(--mut); line-height: 1.5; }
      button.go { border: 0; border-radius: 10px; background: var(--acc); color: #141207; font: 800 1.05rem inherit; padding: 13px 26px; cursor: pointer; }
      button.go:active { transform: scale(0.97); }
      @media (prefers-reduced-motion: reduce) { .face { transition: none; } .tile.done .front { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Brain Pairs</h1>
        <p class="stats"><span>Moves <b id="moves">0</b></span><span>Time <b id="time">0:00</b></span><span>Best <b id="best">–</b></span></p>
      </header>
      <div id="board" role="grid" aria-label="Cards"></div>
    </main>
    <div id="panel">
      <div>
        <h2 id="panel-title">Brain Pairs</h2>
        <p id="panel-text">Flip two cards at a time and find all eight pairs in as few moves as you can.</p>
        <button class="go" id="start" type="button">Play</button>
      </div>
    </div>
    <script src="bg-sdk.js"></script>
    <script src="game.js"></script>
  </body>
</html>
