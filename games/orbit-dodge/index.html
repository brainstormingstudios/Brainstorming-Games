<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Orbit Dodge</title>
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; overflow: hidden; background: #0d0e10; color: #f3f3f4; font-family: ui-sans-serif, system-ui, 'Segoe UI', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #hud { position: fixed; top: 12px; left: 0; right: 0; display: flex; justify-content: center; gap: 22px; font-weight: 800; font-variant-numeric: tabular-nums; pointer-events: none; }
      #hud span { color: #a0a3ab; }
      #hud b { color: #f3f3f4; }
      #panel { position: fixed; inset: 0; display: grid; place-items: center; background: rgb(13 14 16 / 0.86); padding: 24px; text-align: center; }
      #panel[hidden] { display: none; }
      #panel div { max-width: 340px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
      #panel p { color: #a0a3ab; line-height: 1.5; }
      button { border: 0; border-radius: 10px; background: #ffd43b; color: #141207; font: 800 1.05rem inherit; padding: 13px 26px; cursor: pointer; }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <canvas id="c" aria-label="Game area"></canvas>
    <p id="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span></p>
    <div id="panel">
      <div>
        <h1 id="panel-title">Orbit Dodge</h1>
        <p id="panel-text">You circle the core. Tap, click or press Space to switch direction and slip between the sparks. Collect the yellow dots.</p>
        <button id="start" type="button">Play</button>
      </div>
    </div>
    <script src="bg-sdk.js"></script>
    <script src="game.js"></script>
  </body>
</html>
