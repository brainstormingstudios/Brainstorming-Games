# Supabase CLI settings for this repository. The online project is linked with
# `npx supabase link --project-ref <ref>` (stored in supabase/.temp, not committed).
project_id = "brainstorming-games"

# Called by outside services that carry their own proof instead of a Supabase sign-in: the
# pre-QA bot (x-pre-qa-secret) and Razorpay (signed webhook). Each function checks it itself.
[functions.pre-qa-report]
verify_jwt = false

[functions.razorpay-webhook]
verify_jwt = false

# Called by the database webhook on new e-mails, with its own x-outbox-secret header (docs/EMAIL.md).
[functions.mail-outbox]
verify_jwt = false
